name: e_commerce
description: "Labella — Luxury E-Commerce Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # UI / Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  flutter_dotenv: ^5.1.0

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Dependency Injection
  get_it: ^8.0.3

  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
